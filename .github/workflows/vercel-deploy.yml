name: Vercel Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 트리거 추가

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint
        
      # 메타데이터 검사 도구 사용 주석 처리 (로컬 패키지로 npm 레지스트리에 없음)
      # - name: Check Next.js metadata format
      #   run: |
      #     # 메타데이터 검사 도구가 설치되어 있지 않으면 설치
      #     if [ ! -d "fix-next14-metadata" ]; then
      #       echo "Installing metadata check tools..."
      #       npm install ./fix-next14-metadata
      #     fi
      #     npx fix-next14-metadata --ci --dry-run "app/**/*.tsx"
      - name: Echo metadata check placeholder
        run: echo "Skipping metadata check (package not available in registry)"
        
      # 테스트 스크립트가 정의되어 있지 않아 주석 처리
      # - name: Run tests
      #   run: npm test
      - name: Echo test placeholder
        run: echo "Skipping tests (no test script defined in package.json)"
        
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
